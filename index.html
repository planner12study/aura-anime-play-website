<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Anime</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>🎬 Aura Anime</h1>

        <!-- بەشی زیادکردنی ئەنیمی -->
        <div class="card">
            <h3>زیادکردنی ئەڵقەی نوێ</h3>
            <input type="text" id="title" placeholder="ناوی ئەنیمی (بۆ نموونە: Naruto)">
            <input type="text" id="season" placeholder="وەرز (بۆ نموونە: وەرزی 1)">
            <input type="text" id="episode" placeholder="ژمارەی ئەڵقە (بۆ نموونە: ئەڵقەی 1)">
            <input type="text" id="videoLink" placeholder="لینکی ڤیدیۆ (Embed یاخود MP4)">
            <button id="save-btn">پاشەکەوتکردن</button>
        </div>

        <!-- بەشی پلەیەر -->
        <div class="card" id="player-container" style="display:none;">
            <h3 id="playing-title">پەخشکردن</h3>
            <div id="video-wrapper"></div>
        </div>

        <!-- لیستی ئەنیمییەکان -->
        <div class="card">
            <h2>لیستی ئەنیمییەکان</h2>
            <div id="anime-list"></div>
        </div>
    </div>

    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
